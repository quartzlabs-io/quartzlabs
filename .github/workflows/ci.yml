name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # A pull request run is superseded by the next push to it, which is what a
  # cancelling group is for. A run on main is not: it ends in a deploy, and
  # cancelling one in flight leaves production in a state nobody chose. That
  # already happened here, with two pushes a minute apart killing the first
  # deploy during npm ci. The job-level group on deploy could not prevent it,
  # because the cancellation comes from above the job.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege at the top; a job that needs more asks for it explicitly.
permissions:
  contents: read

jobs:
  # Everything that reads the source. Fast, and first, so a formatting slip does
  # not wait behind a build.
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned by commit, not by tag. A tag is a mutable pointer: whoever controls
      # the action's repository can move v7 to different code tomorrow, and every
      # workflow that trusts the tag runs it. The trailing comment keeps the
      # version legible and lets Dependabot update both together.
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci`, never `npm install`: it installs exactly the lockfile, refuses
      # to run when the lockfile and package.json disagree, and is the only
      # install a reviewer can audit. --ignore-scripts because a dependency's
      # install hook is the attack this project's quarantine exists for.
      - run: npm ci --ignore-scripts

      - name: Formatting
        run: npm run format:check

      - name: Types
        run: npm run typecheck

      - name: Design system
        run: npm run check:tokens

      - name: Secrets
        run: npm run check:secrets

      - name: Prose
        run: npm run check:prose

  # Everything that reads the built artefact. A build step can rewrite what was
  # authored — this repository has been bitten twice — so the tests read dist/.
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Tests
        run: npm run test

      - name: Budget
        run: |
          BYTES=$(cat $(find dist -name '*.js') 2>/dev/null | gzip -c | wc -c)
          echo "### Weight" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "JavaScript  ${BYTES} B gzipped (budget 15360)" >> "$GITHUB_STEP_SUMMARY"
          du -ch dist/index.html dist/_astro/*.css dist/fonts/*.woff2 | tail -1 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: dist
          retention-days: 7

  # Supply chain. Separate job so a new advisory is legible on its own rather
  # than buried in a build log.
  audit:
    name: Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Known advisories
        run: npm audit --audit-level=high

  # The gate. Nothing deploys unless every job above is green; this exists so the
  # branch protection rule has one status to require instead of four.
  ready:
    name: Ready to deploy
    runs-on: ubuntu-latest
    needs: [static, verify, audit]
    if: always()
    steps:
      - name: Check
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "A required check failed. Nothing ships."
            exit 1
          fi
          echo "All checks green."

  # The last mile. Three things keep this from being the weak end of the
  # pipeline.
  #
  # It cannot run from a pull request. `pull_request` never exposes secrets to a
  # fork, but the branch and event are checked anyway rather than relied upon.
  #
  # It deploys the artefact the tests actually read, not a second build of the
  # same commit. The whole suite reads dist/ precisely because a build step can
  # rewrite what was authored, and shipping a different dist/ than the one under
  # test would give that up at the last step.
  #
  # No third-party action touches the credential. wrangler is a devDependency
  # pinned by the lockfile, so the token is seen by the deploy tool and by
  # nothing else.
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [ready]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://quartzlabs.io
    # Never two deploys at once. This group cannot stop a cancellation coming
    # from the workflow level above it, which is why that one now spares main.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: dist

      - name: Publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # Reports a broken deploy rather than preventing one, which is still worth
      # having: a green pipeline over a dead site is the failure that goes
      # unnoticed longest. It also asks the live host the questions dist/ cannot
      # answer, because those live in dashboard state and a click can undo any of
      # them without touching this repository.
      - name: Live configuration
        run: npm run check:live
